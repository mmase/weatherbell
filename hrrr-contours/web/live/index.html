<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HRRR Live Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --panel: rgba(246, 248, 250, 0.92);
  --panel-solid: #f6f8fa;
  --ink: #15202b;
  --muted: #5a6776;
  --rule: #d3dae2;
  --accent: #1d6fd1;
  --water: #c9d6e0;
  --land: #e4e6e1;
  --border: rgba(18, 24, 33, 0.62);
  --label: #121821;
  --halo: rgba(255, 255, 255, 0.78);
  --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --panel: rgba(16, 21, 28, 0.9);
    --panel-solid: #10151c;
    --ink: #e5eaf0;
    --muted: #8e9bab;
    --rule: #28313d;
    --accent: #6eaaf5;
    --water: #0c1117;
    --land: #1a1f26;
    --border: rgba(10, 12, 16, 0.75);
    --label: #0d1117;
    --halo: rgba(255, 255, 255, 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --panel: rgba(16, 21, 28, 0.9);
  --panel-solid: #10151c;
  --ink: #e5eaf0;
  --muted: #8e9bab;
  --rule: #28313d;
  --accent: #6eaaf5;
  --water: #0c1117;
  --land: #1a1f26;
  --border: rgba(10, 12, 16, 0.75);
  --label: #0d1117;
  --halo: rgba(255, 255, 255, 0.7);
}
html, body { height: 100%; margin: 0; }
body { background: var(--water); color: var(--ink); font: 14px/1.4 var(--ui); overflow: hidden; }
#map { position: absolute; inset: 0; }
/* global models: the globe floats in space (the map canvas is transparent around it) */
body.space { background: #000; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
body.space #sky { display: block; }

/* the few MapLibre rules the page needs (its stylesheet is not loaded) */
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: crosshair; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right { display: none; }

.panel {
  position: absolute; z-index: 2;
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--rule); border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 24px rgba(0,0,0,.10);
}
#info {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  width: min(292px, calc(100vw - 32px)); padding: 14px 16px 12px;
  display: grid; gap: 10px;
}
.eyebrow { font: 600 11px/1 var(--ui); font-stretch: 80%; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 700 20px/1.1 var(--ui); font-stretch: 78%; letter-spacing: -.005em; text-wrap: balance; }
.run { font: 400 12px/1.35 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.readout { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 2px 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
#val { font: 500 30px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; min-width: 5.2ch; }
#val small { font-size: 15px; color: var(--muted); margin-left: 1px; }
#sub { font: 400 12px/1.35 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px/1 var(--ui); font-stretch: 88%; color: var(--ink);
  background: transparent; border: 1px solid var(--rule); border-radius: 999px;
  padding: 6px 10px 6px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
.chip[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.credit { font-size: 11px; color: var(--muted); line-height: 1.35; }
.credit a { color: inherit; }

#legend {
  left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100vw - 32px)); padding: 10px 14px 8px; box-sizing: border-box;
}
#legend .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
#bar { position: relative; height: 14px; border-radius: 2px; }
#bar canvas { width: 100%; height: 100%; display: block; border-radius: 2px; }
#cursor { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); box-shadow: 0 0 0 1.5px var(--panel-solid); display: none; }
#ticks { position: relative; height: 16px; margin-top: 3px; font: 400 11px/16px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
#ticks span.frz { color: var(--accent); font-weight: 500; }

#zoom { position: absolute; z-index: 2; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; }
#zoom button { width: 34px; height: 34px; font: 500 18px/1 var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); cursor: pointer; }
#zoom button:first-child { border-radius: 6px 6px 0 0; border-bottom: none; }
#zoom button:last-child { border-radius: 0 0 6px 6px; }
#zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#zl { position: absolute; z-index: 2; right: 16px; top: calc(92px + env(safe-area-inset-top, 0px)); font: 400 11px var(--mono); color: var(--muted); background: var(--panel); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--rule); }

@media (max-width: 560px) {
  #info { padding: 10px 12px; gap: 8px; width: calc(100vw - 32px - 50px); }
  h1 { font-size: 17px; }
  #val { font-size: 24px; }
  .credit { display: none; }
}

/* timeline */
.timeline { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-bottom: 8px; }
#play { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule); background: var(--panel-solid); color: var(--ink); cursor: pointer; font: 500 12px/1 var(--mono); }
#play:focus-visible, #hour:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#hour { width: 100%; accent-color: var(--accent); }
#valid { font: 500 12px/1.2 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
#valid small { display: block; color: var(--muted); font-weight: 400; }
#perf { position: absolute; z-index: 2; right: 16px; top: calc(122px + env(safe-area-inset-top, 0px)); font: 400 11px/1.4 var(--mono); color: var(--muted); background: var(--panel); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--rule); white-space: pre; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="map" role="application" aria-label="Map of an HRRR forecast field drawn as vector bands"></div>

<section id="info" class="panel" aria-live="polite">
  <div>
    <div class="eyebrow" id="eyebrow">Forecast</div>
    <h1 id="title">Loading…</h1>
    <div class="run" id="run">Loading…</div>
  </div>
  <div class="readout">
    <div id="val">––</div>
    <div id="sub">Hover or tap<br>the map</div>
  </div>
  <div class="toggles" id="fields" role="group" aria-label="Field"></div>
  <div class="toggles">
    <button class="chip" id="t-labels" aria-pressed="true">Labels</button>
    <button class="chip" id="t-borders" aria-pressed="true">Borders</button>
  </div>
  <div class="credit"><span id="credit-bands"></span> Zoomed out: tiles built when the run is published. Zoomed in and during playback: contoured on this device from the model grid. Data: NOAA/NCEP <span id="credit-model">HRRR</span> via <a id="credit-link" href="https://registry.opendata.aws/noaa-hrrr-pds/" target="_blank" rel="noopener">AWS Open Data</a>. Boundaries: Natural Earth, US Census.</div>
</section>

<div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
<div id="zl">z 4.0</div>
<div id="perf" hidden></div>

<section id="legend" class="panel" aria-label="Forecast time and temperature colour scale">
  <div class="timeline">
    <button id="play" aria-label="Play forecast">▶</button>
    <input id="hour" type="range" min="0" max="12" step="1" value="0" aria-label="Forecast hour">
    <div id="valid">––<small>––</small></div>
  </div>
  <div class="head"><span class="eyebrow" id="legend-title"></span><span class="eyebrow" id="range"></span></div>
  <div id="bar"><canvas id="barc" width="600" height="1"></canvas><div id="cursor"></div></div>
  <div id="ticks"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<script type="module">
import { Grid, sample, levelMeta } from "./contour.js";

// ------------------------------------------------------------------ colours
// One palette shared by the tile layers and the WebGL layer (CIELAB blend).
// field: #t2m / #pwat, else the first one published
const RUNS = await (await fetch("run/index.json")).json();
const VAR_ID = RUNS.vars.some((v) => v.id === location.hash.slice(1)) ? location.hash.slice(1) : RUNS.vars[0].id;
const BASE = `run/${VAR_ID}/`;
const meta = await (await fetch(`${BASE}meta.json`)).json();
const VAR = meta.var, STEP = VAR.interval ?? 1, DEC = VAR.decimals;
const TH = VAR.thresholds || null; // uneven bands: band b covers [TH[b], TH[b+1])
const STOPS = VAR.stops; // display units -> colour
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
const gam = (c) => 255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
const XN = 0.95047, ZN = 1.08883;
function toLab([r, g, b]) {
  r = lin(r); g = lin(g); b = lin(b);
  const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116);
  const x = f((0.4124 * r + 0.3576 * g + 0.1805 * b) / XN), y = f(0.2126 * r + 0.7152 * g + 0.0722 * b), z = f((0.0193 * r + 0.1192 * g + 0.9505 * b) / ZN);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
function fromLab([L, a, bb]) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - bb / 200;
  const inv = (t) => (t ** 3 > 216 / 24389 ? t ** 3 : (116 * t - 16) / (24389 / 27));
  const x = XN * inv(fx), y = inv(fy), z = ZN * inv(fz);
  const r = 3.2406 * x - 1.5372 * y - 0.4986 * z, g = -0.9689 * x + 1.8758 * y + 0.0415 * z, b = 0.0557 * x - 0.2040 * y + 1.0570 * z;
  return [r, g, b].map((c) => Math.max(0, Math.min(255, Math.round(gam(Math.max(0, c))))));
}
const LABS = (STOPS || []).map(([t, c]) => [t, toLab(hex(c))]);
function colorAt(v) {
  if (v <= LABS[0][0]) return fromLab(LABS[0][1]);
  for (let i = 1; i < LABS.length; i++) {
    if (v <= LABS[i][0]) {
      const [a, A] = LABS[i - 1], [b, B] = LABS[i], f = (v - a) / (b - a);
      return fromLab(A.map((x, k) => x + (B[k] - x) * f));
    }
  }
  return fromLab(LABS[LABS.length - 1][1]);
}
// Contours work in band units (value / interval): band b covers [b, b+1) * interval.
const BAND0 = Math.floor(meta.tmin) - 64; // palette texel 0
// colour per band; null = transparent (e.g. snowfall under the first threshold)
const bandRGB = (b) => {
  if (!VAR.colors) return colorAt((b + 0.5) * STEP);
  if (b < 0) return null;
  return hex(VAR.colors[Math.min(b, VAR.colors.length - 1)]);
};
const fmtV = (v, extra = 0) => v.toFixed(DEC + extra);
const UNIT = VAR.units, isTemp = UNIT === "°F";
const rgbStr = (c) => (c ? `rgb(${c[0]},${c[1]},${c[2]})` : "rgba(0,0,0,0)");
// band units <-> display units
function toValue(u) {
  if (!TH) return u * STEP;
  if (u < 0) return Math.max(0, (u + 1) * TH[0]);
  const b = Math.min(Math.floor(u), TH.length - 2), f = u - b;
  return TH[b] + f * (TH[b + 1] - TH[b]);
}
const bandText = (b) => (!TH ? `${fmtV(b * STEP)}–${fmtV((b + 1) * STEP)}` : b < 0 ? `< ${TH[0]}` : b >= TH.length - 1 ? `> ${TH[TH.length - 1]}` : `${TH[b]}–${TH[b + 1]}`);

// ------------------------------------------------------------------ data
const b64 = meta.encoding === "base64";
async function fetchBin(path) {
  const r = await fetch(b64 ? path.replace(/\.\w+$/, ".txt").replace(/\.i16\.txt$/, ".txt") : path);
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  if (!b64) return r.arrayBuffer();
  const s = (await r.text()).trim();
  if (Uint8Array.fromBase64) return Uint8Array.fromBase64(s).buffer;
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
const inflate = async (buf) => new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
const HOURS = meta.hours, NX = meta.nx, NY = meta.ny;
const hh = (h) => String(h).padStart(2, "0");
// Decoded hours, keyed "hour@k" (k = pyramid level: every k-th node; 1 = full grid),
// least recently used first and trimmed to a byte budget (a 300-frame run must not
// accumulate).  Zoomed out and in playback the lattice samples every k-th node,
// so only that level is downloaded: 1/64 of the data at k = 8.
const LEVELS = [1, ...(meta.levels || [])];
const fieldCache = new Map(); // "h@k" -> Promise<Int16Array>
const fieldReady = new Map(); // "h@k" -> Int16Array, once loaded
const MAIN_BUDGET = (navigator.deviceMemory && navigator.deviceMemory <= 4 ? 64 : 160) * 1e6;
let readyBytes = 0;
const POLAR_CAPS = !!meta.global && meta.proj.type === "latlon";
const levelDims = (k) => [(NX - 1) / k + 1, (NY - 1) / k + 1];
function field(h, k = 1) {
  const key = `${h}@${k}`;
  if (fieldCache.has(key)) { const p = fieldCache.get(key); fieldCache.delete(key); fieldCache.set(key, p); return p; }
  const [nx, ny] = levelDims(k);
  const p = fetchBin(`${BASE}grids/f${hh(h)}${k > 1 ? "-" + k : ""}.i16.gz`).then(inflate).then((buf) => {
    const d = new Int16Array(buf);
    for (let r = 0; r < ny; r++) for (let c = 1, o = r * nx; c < nx; c++) d[o + c] += d[o + c - 1]; // undo row deltas
    if (fieldCache.get(key) === p) { fieldReady.set(key, d); readyBytes += d.byteLength; trimFields(); }
    return d;
  });
  fieldCache.set(key, p);
  return p;
}
function trimFields() {
  for (const key of fieldCache.keys()) {
    if (readyBytes <= MAIN_BUDGET) break;
    const d = fieldReady.get(key), h = +key.split("@")[0];
    if (!d || h === frame.hA || h === frame.hB) continue; // pending, or on screen
    fieldCache.delete(key); fieldReady.delete(key); readyBytes -= d.byteLength;
  }
}
const grid = new Grid(meta, { positions: false }); // projection only, for the readout
const levelGrids = new Map([[1, grid]]);
const levelGrid = (k) => { if (!levelGrids.has(k)) levelGrids.set(k, new Grid(levelMeta(meta, k), { positions: false })); return levelGrids.get(k); };
// coarsest pyramid level that the lattice at this zoom reads exactly
function levelFor(z, px, coarse) {
  const s = grid.step(Math.max(0, Math.round(z)), px, coarse);
  return LEVELS.reduce((k, L) => (L <= s && L > k ? L : k), 1);
}

// ------------------------------------------------------------------ workers
const NW = Math.max(1, Math.min(6, (navigator.hardwareConcurrency || 4) - 1));
const pool = [];
const jobs = new Map(); // id -> {resolve}
let nextId = 1;
for (let i = 0; i < NW; i++) {
  const w = new Worker(new URL("./worker.js", import.meta.url), { type: "module" });
  const entry = { w, inflight: 0, has: new Set() }; // "h@k" sent to this worker
  w.onmessage = (e) => {
    const m = e.data;
    if (m.type !== "tile") return;
    entry.inflight--;
    const j = jobs.get(m.id); jobs.delete(m.id);
    j && j.resolve(m);
  };
  w.postMessage({ type: "meta", meta });
  pool.push(entry);
}
async function contour(job) {
  const k = levelFor(job.z, job.spacing, job.allowCoarse);
  const need = [job.hA, job.hB].filter((h) => h != null);
  const data = await Promise.all(need.map((h) => field(h, k)));
  const e = pool.reduce((a, b) => (b.inflight < a.inflight ? b : a));
  const keys = need.map((h) => `${h}@${k}`);
  keys.forEach((key, i) => {
    if (e.has.has(key)) return;
    e.w.postMessage({ type: "field", hour: need[i], k, buf: data[i].buffer.slice(0) });
    e.has.add(key);
  });
  e.inflight++;
  const id = nextId++;
  const m = await new Promise((resolve) => { jobs.set(id, { resolve }); e.w.postMessage({ type: "tile", id, k, globe: !!meta.global, ...job }); });
  if (m.missing) keys.forEach((key) => e.has.delete(key)); // the worker evicted it: resend next time
  return m;
}

// ------------------------------------------------------------------ state
const CLIENT_MIN = meta.tiles ? meta.tiles.maxzoom + 1 : 0; // client contours from this zoom up
const STATIC_PX = 2, PLAY_PX = 6;                             // lattice spacing, CSS px
let hour = HOURS[0], playing = false, playT = 0;
let frame = { hA: hour, hB: null, w: 0, px: STATIC_PX, coarse: false };
const frameKey = (f) => `${f.hA}|${f.hB}|${f.w.toFixed(3)}|${f.px}`;

// ------------------------------------------------------------------ WebGL layer
// Vertex shader built on MapLibre's own projection code (shaderData prelude),
// so tiles project correctly on flat Mercator, on the globe, and in between.
// a_pos is tile-local (float, 0..1 = the tile; geometry may reach past it and is
// masked to the tile with the stencil buffer); projectTile() takes tile units
// 0..8192 with per-tile uniforms from getProjectionData().
// Polar caps (u_cap) pass raw tile units: y = -32768 / 40960 is MapLibre's
// north / south pole, so the globe has no hole above web mercator's 85°.
const makeVS = (sd) => `#version 300 es
${sd.vertexShaderPrelude}
${sd.define}
in vec2 a_pos; in int a_band; uniform float u_cap;
flat out int v_band;
void main() { vec2 p = u_cap > 0.5 ? a_pos : a_pos * 8192.0; gl_Position = projectTile(p, p); v_band = a_band; }`;
const FS = `#version 300 es
precision highp float;
flat in int v_band; uniform sampler2D u_pal; out vec4 color;
void main() { color = texelFetch(u_pal, ivec2(clamp(v_band - ${BAND0}, 0, 255), 0), 0); if (color.a == 0.0) discard; }`;

const cache = new Map();    // tileKey -> {vao, bufs, count, bytes, used}
const inflight = new Set();
let shown = [];             // last complete set of {key, xw} (xw: tile x incl. world copy)
let displayed = null;       // frameKey of the last frame drawn complete
let cachedBytes = 0;
const GPU_BUDGET = (navigator.deviceMemory && navigator.deviceMemory <= 4 ? 160 : 384) * 1e6;
const stats = { tiles: 0, ms: 0, tris: 0 };

function visibleTiles(map, f) {
  const z = Math.max(0, Math.min(18, Math.round(map.getZoom())));
  const n = 2 ** z, b = map.getBounds();
  const tx = (lon) => Math.floor((lon + 180) / 360 * n);
  const ty = (lat) => Math.floor((1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2 * n);
  // global models wrap: x runs past the world (world copies); the data tile is x mod n
  const x0 = meta.global ? tx(b.getWest()) : Math.max(tx(Math.max(b.getWest(), DOMAIN.w)), 0);
  const x1 = meta.global ? tx(b.getEast()) : Math.min(tx(Math.min(b.getEast(), DOMAIN.e)), n - 1);
  const y0 = Math.max(ty(Math.min(b.getNorth(), DOMAIN.n)), 0), y1 = Math.min(ty(Math.max(b.getSouth(), DOMAIN.s)), n - 1);
  const c = map.getCenter(), cx = (c.lng + 180) / 360 * n, cy = (1 - Math.log(Math.tan(Math.PI / 4 + c.lat * Math.PI / 360)) / Math.PI) / 2 * n;
  const out = [];
  for (let xw = x0; xw <= x1; xw++) for (let y = y0; y <= y1; y++)
    out.push({ z, x: ((xw % n) + n) % n, xw, y, d: (xw + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 });
  out.sort((a, b) => a.d - b.d);
  const fk = frameKey(f);
  return out.map((t) => ({ ...t, key: `${fk}|${t.z}/${t.x}/${t.y}` }));
}

const live = {
  id: "live", type: "custom", renderingMode: "2d",
  program(sd) {
    // one program per MapLibre projection variant (mercator / globe)
    this.programs ??= new Map();
    if (this.programs.has(sd.variantName)) return this.programs.get(sd.variantName);

    if (fixing) return;
    if (viewInsideData()) { good = state(); return; }
    // went past the data: pick the valid view closest to where the user was
    // heading, searching back along the move and in toward the domain centre
    fixing = true;
    const target = state();
    const mid = { center: CENTER, zoom: target.zoom };
    const search = (from) => {
      let lo = 0, hi = 1; // t = how far from `from` toward target
      for (let k = 0; k < 12; k++) {
        const t = (lo + hi) / 2;
        map.jumpTo(lerp(from, target, t));
        if (viewInsideData()) lo = t; else hi = t;
      }
      map.jumpTo(lerp(from, target, lo));
      return viewInsideData() ? state() : null;
    };
    const dist = (a) => { const p = map.project(target.center), q = map.project(a.center); return Math.hypot(p.x - q.x, p.y - q.y); };
    const options = [search(good), search(mid)].filter(Boolean);
    const best = options.sort((a, b) => dist(a) - dist(b))[0] || good;
    map.jumpTo(best);
    good = state();
    fixing = false;
  });
  map.on("resize", () => { for (let k = 0; k < 60 && !viewInsideData(); k++) map.jumpTo({ zoom: map.getZoom() + 0.1 }); good = state(); });
}
window.map = map;

// ------------------------------------------------------------------ space
// Global models zoom out to a globe; behind it is a star field on a celestial
// sphere fixed to the Earth (as in Google Earth), so stars turn with the globe.
// Stars are drawn in their own canvas under the (transparent) map canvas, so
// the globe hides the ones behind it.  Real-sky statistics: many faint stars,
// few bright ones, colours from blue-white to orange, and the Milky Way along
// the galactic plane with its bright core toward Sagittarius.
if (meta.global) {
  document.body.classList.add("space");
  const sky = document.getElementById("sky"), sctx = sky.getContext("2d");
  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
  const unit = (ra, dec) => [Math.cos(dec) * Math.cos(ra), Math.cos(dec) * Math.sin(ra), Math.sin(dec)];
  const D = Math.PI / 180;
  // galactic frame in equatorial coordinates (J2000 north galactic pole and centre)
  const GP = unit(192.859 * D, 27.128 * D), GC = unit(266.405 * D, -28.936 * D);
  const GY = [GP[1] * GC[2] - GP[2] * GC[1], GP[2] * GC[0] - GP[0] * GC[2], GP[0] * GC[1] - GP[1] * GC[0]];
  const gal = (l, b) => { const c = Math.cos(b), x = c * Math.cos(l), y = c * Math.sin(l), z = Math.sin(b);
    return [0, 1, 2].map((i) => x * GC[i] + y * GY[i] + z * GP[i]); };
  // star colours by spectral class, weighted like naked-eye stars
  const TINTS = [["155,176,255", 0.05], ["170,191,255", 0.12], ["202,215,255", 0.2], ["248,247,255", 0.25],
                 ["255,244,234", 0.18], ["255,221,180", 0.12], ["255,204,145", 0.08]];
  const tint = () => { let u = rnd(); for (const [c, w] of TINTS) if ((u -= w) < 0) return c; return TINTS[3][0]; };
  const stars = []; // [x, y, z, radius px, alpha, colour]
  for (let i = 0; i < 6000; i++) { // field stars, uniform on the sphere
    const z = rnd() * 2 - 1, a = rnd() * 2 * Math.PI, r = Math.sqrt(1 - z * z);
    const m = rnd() ** 7; // brightness: a steep power law (few bright stars)
    stars.push([r * Math.cos(a), r * Math.sin(a), z, 0.4 + 1.4 * m, Math.min(1, 0.12 + 0.2 * rnd() + 1.5 * m), tint()]);
  }
  for (let i = 0; i < 9000; i++) { // unresolved Milky Way stars, denser toward the core
    const l = (rnd() < 0.35 ? gauss() * 0.6 : rnd() * 2 * Math.PI - Math.PI);
    const b = gauss() * (0.05 + 0.05 * Math.exp(-l * l));
    if (Math.abs(b + 0.01) < 0.012 && Math.abs(l) < 1.4 && rnd() < 0.7) continue; // the Great Rift (dust lane)
    stars.push([...gal(l, b), 0.35 + rnd() * 0.3, 0.1 + rnd() * 0.3, rnd() < 0.5 ? "255,244,234" : "225,230,255"]);
  }
  const glow = []; // diffuse Milky Way light: many faint soft blobs along the plane
  for (let i = 0; i < 1600; i++) {
    const l = rnd() < 0.3 ? gauss() * 0.5 : rnd() * 2 * Math.PI - Math.PI;
    const core = Math.exp(-l * l / 0.4);
    const b = gauss() * (0.045 + 0.05 * core);
    if (Math.abs(b + 0.01) < 0.015 && Math.abs(l) < 1.4 && rnd() < 0.6) continue; // dust lane
    glow.push([...gal(l, b), 0.03 + 0.05 * rnd() + 0.03 * core, 0.006 + 0.014 * core + 0.004 * rnd(), core > 0.3 ? 1 : 0]);
  }
  const sprite = (inner, outer) => { // radial falloff
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, `rgba(${inner},1)`); rg.addColorStop(0.45, `rgba(${outer},0.4)`); rg.addColorStop(1, `rgba(${outer},0)`);
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64); return c; };
  const blobs = [sprite("205,212,240", "185,195,230"), sprite("255,236,205", "235,215,190")]; // disc, warmer core
  const flare = document.createElement("canvas"); // bright-star halo
  flare.width = flare.height = 32;
  { const g = flare.getContext("2d"), rg = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    rg.addColorStop(0, "rgba(255,255,255,0.7)"); rg.addColorStop(0.2, "rgba(255,255,255,0.15)"); rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 32, 32); }

  let queued = false;
  const drawSky = () => {
    queued = false;
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = sky.clientWidth, H = sky.clientHeight;
    if (sky.width !== Math.round(W * dpr) || sky.height !== Math.round(H * dpr)) { sky.width = Math.round(W * dpr); sky.height = Math.round(H * dpr); }
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, W, H);
    if (map.getZoom() > 5.5) return; // the Earth fills the view
    // camera looks at the map centre from space: forward = -up at the centre,
    // right = local east, screen-up = local north (the map never rotates)
    const c = map.getCenter(), lo = c.lng * D, la = c.lat * D;
    const F = [-Math.cos(la) * Math.cos(lo), -Math.cos(la) * Math.sin(lo), -Math.sin(la)];
    const R = [-Math.sin(lo), Math.cos(lo), 0];
    const U = [-Math.sin(la) * Math.cos(lo), -Math.sin(la) * Math.sin(lo), Math.cos(la)];
    const fov = (map.transform.fov ?? 36.87) * D, f = H / 2 / Math.tan(fov / 2), cx = W / 2, cy = H / 2;
    const proj = (s) => { const w = s[0] * F[0] + s[1] * F[1] + s[2] * F[2];
      if (w < 0.2) return null;
      const x = cx + f * (s[0] * R[0] + s[1] * R[1] + s[2] * R[2]) / w, y = cy - f * (s[0] * U[0] + s[1] * U[1] + s[2] * U[2]) / w;
      return x < -60 || y < -60 || x > W + 60 || y > H + 60 ? null : [x, y]; };
    sctx.globalCompositeOperation = "lighter";
    for (const g of glow) {
      const p = proj(g); if (!p) continue;
      const r = g[3] * f; sctx.globalAlpha = g[4];
      sctx.drawImage(blobs[g[5]], p[0] - r, p[1] - r, 2 * r, 2 * r);
    }
    for (const s of stars) {
      const p = proj(s); if (!p) continue;
      const r = s[3];
      sctx.globalAlpha = s[4];
      if (r > 1.3) sctx.drawImage(flare, p[0] - 3 * r, p[1] - 3 * r, 6 * r, 6 * r);
      sctx.fillStyle = `rgb(${s[5]})`;
      if (r < 0.8) sctx.fillRect(p[0] - r, p[1] - r, 2 * r, 2 * r);
      else { sctx.beginPath(); sctx.arc(p[0], p[1], r, 0, 2 * Math.PI); sctx.fill(); }
    }
    sctx.globalAlpha = 1; sctx.globalCompositeOperation = "source-over";
  };
  const queueSky = () => { if (!queued) { queued = true; requestAnimationFrame(drawSky); } };
  map.on("move", queueSky); map.on("resize", queueSky); map.on("load", queueSky);
  queueSky();
}
window.__live = { get frame() { return frame; }, cache, inflight, get shown() { return shown; }, stats, missing: 0, frames: 0 };
const perfEl = document.getElementById("perf");

// tile layers are hidden while playing (the WebGL layer draws every zoom then)
function setTileLayers(on) {
  for (const id of ["base", ...levelIds, "lab10", "lab5"]) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
}

// ------------------------------------------------------------------ timeline
const run = new Date(meta.run);
const fmt = (d) => d.toLocaleString("en-US", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "UTC" }) + "Z";
document.getElementById("run").textContent = `Run ${fmt(run)} · f${hh(HOURS[0])}–f${hh(HOURS[HOURS.length - 1])}`;
const slider = document.getElementById("hour"), validEl = document.getElementById("valid"), playBtn = document.getElementById("play");
slider.min = 0; slider.max = HOURS.length - 1; // slider moves over forecast steps
document.getElementById("eyebrow").textContent = `${meta.model} · ${meta.grid || "CONUS 3 km"} · Forecast`;
function showValid(t) {
  const d = new Date(run.getTime() + t * 3600e3);
  validEl.innerHTML = `${meta.accumulated ? "Total to " : ""}${fmt(d)}<small>+${t.toFixed(t % 1 ? 1 : 0)} h</small>`;
}
function setHour(h) {
  hour = h; slider.value = HOURS.indexOf(h); showValid(h);
  frame = { hA: h, hB: null, w: 0, px: STATIC_PX, coarse: false };
  map.getSource("t2m").setTiles([`hrrr://${h}/{z}/{x}/{y}`]);
  map.triggerRepaint();
  if (lastPt) readout(lastPt.point, lastPt.lngLat); // loads the full grid, for the readout only
}
slider.addEventListener("input", () => setHour(HOURS[+slider.value]));
let lastTick = 0;
const STEPS_PER_SEC = 1;
function tick(now) {
  if (!playing) return;
  const dt = lastTick ? (now - lastTick) / 1000 : 0; lastTick = now;
  playT += dt * STEPS_PER_SEC; // in forecast-step units
  if (playT >= HOURS.length - 1) playT = 0;
  // advance the requested frame only once the previous one is complete, so
  // slower devices simply show fewer in-between frames
  if (displayed === frameKey(frame)) {
    window.__live.frames++;
    let i = Math.floor(playT), w = Math.round((playT - i) * 16) / 16;
    if (w >= 1) { i += 1; w = 0; }
    const hA = HOURS[i], hB = HOURS[i + 1];
    if (hA !== frame.hA) prefetch(i);
    frame = w === 0 || hB == null ? { hA, hB: null, w: 0, px: PLAY_PX, coarse: true } : { hA, hB, w, px: PLAY_PX, coarse: true };
    slider.value = i; showValid(hB == null ? hA : hA + w * (hB - hA));
    map.triggerRepaint();
  }
  requestAnimationFrame(tick);
}
// playback look-ahead: the next few hours, at the pyramid level playback reads
// (bounded, so a long run streams instead of piling up in memory)
function prefetch(i) {
  const k = levelFor(map.getZoom(), PLAY_PX, true);
  for (const h of HOURS.slice(i, i + 4)) field(h, k);
}
playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "❚❚" : "▶";
  playBtn.setAttribute("aria-label", playing ? "Pause forecast" : "Play forecast");
  if (playing) {
    prefetch(HOURS.indexOf(hour));
    // playback quality from the first frame (a full-detail frame at a low zoom is slow)
    frame = { ...frame, px: PLAY_PX, coarse: true };
    playT = HOURS.indexOf(hour); lastTick = 0; setTileLayers(false);
    requestAnimationFrame(tick);
  } else {
    setTileLayers(true);
    setHour(HOURS[Math.min(HOURS.length - 1, Math.round(playT))]);
  }
});
showValid(hour);

// ------------------------------------------------------------------ legend + readout
document.getElementById("title").textContent = VAR.name;
document.title = `${meta.model} ${VAR.short}`;
document.getElementById("legend-title").textContent = TH
  ? `${VAR.short} ${UNIT}${meta.var.id === "snow" ? " · 10:1 ratio" : ""}`
  : `${VAR.short} ${UNIT} · ${fmtV(STEP)}${isTemp ? "°" : " " + UNIT} bands`;
document.getElementById("credit-bands").textContent = TH
  ? `Vector bands at ${TH[0]}, ${TH[1]}, ${TH[2]} … ${TH[TH.length - 1]} ${UNIT}.`
  : `Vector bands every ${fmtV(STEP)} ${UNIT}.`;
document.getElementById("range").textContent = TH
  ? `max ${fmtV(meta.vmax)} ${UNIT}` : `${fmtV(meta.vmin)} to ${fmtV(meta.vmax)} ${UNIT} this run`;
// legend in band units: one pixel per band
const TICK = TH ? 1 : Math.round(VAR.ticks / STEP);
const lgLo = TH ? 0 : Math.floor(meta.tmin / TICK) * TICK, lgHi = TH ? TH.length - 1 : Math.ceil(meta.tmax / TICK) * TICK;
const bc = document.getElementById("barc"), bctx = bc.getContext("2d");
bc.width = lgHi - lgLo; bc.style.imageRendering = "pixelated";
for (let b = lgLo; b < lgHi; b++) { bctx.fillStyle = rgbStr(bandRGB(b)); bctx.fillRect(b - lgLo, 0, 1, 1); }
const ticks = document.getElementById("ticks");
const pos = (b) => `${((Math.max(lgLo, Math.min(lgHi, b)) - lgLo) / (lgHi - lgLo)) * 100}%`;
const hl = VAR.highlight == null ? null : VAR.highlight / STEP;
const tickBands = TH ? [0, 2, 4, 8, 12, 16, 20, 22, 26, 30, 34, 38, 42, 46, 50, 54, 58].filter((b) => b <= lgHi) : null;
for (let b = lgLo; b <= lgHi; b += TICK) {
  if (tickBands && !tickBands.includes(b)) continue;
  const s = document.createElement("span"); s.style.left = pos(b); s.textContent = TH ? TH[b] : +(b * STEP).toFixed(DEC); ticks.append(s);
  if (hl != null && Math.abs(b - hl) < TICK / 2) s.style.visibility = "hidden"; // make room for the highlight tick
}
if (hl != null && hl > lgLo && hl < lgHi) {
  const s = document.createElement("span"); s.className = "frz"; s.style.left = pos(hl); s.textContent = VAR.highlight; ticks.append(s);
}
// field switcher
const fieldsEl = document.getElementById("fields");
for (const v of RUNS.vars) {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = v.name; b.setAttribute("aria-pressed", v.id === VAR_ID);
  b.onclick = () => { if (v.id !== VAR_ID) { location.hash = v.id; location.reload(); } };
  fieldsEl.append(b);
}
const val = document.getElementById("val"), sub = document.getElementById("sub"), cur = document.getElementById("cursor");
let lastPt = null, pendingRO = null;
async function readout(point, lngLat) {
  lastPt = { point, lngLat };
  // while playing, read the level on screen (the full grid per frame would defeat the pyramid)
  const f = frame, k = playing ? levelFor(map.getZoom(), PLAY_PX, true) : 1;
  const A = await field(f.hA, k), B = f.hB == null ? null : await field(f.hB, k);
  const t = sample(levelGrid(k), B ? [A, B] : [A], f.w, lngLat.lng, lngLat.lat);
  if (t == null) { val.innerHTML = "––"; sub.innerHTML = `Outside the<br>${meta.model} domain`; cur.style.display = "none"; return; }
  const v = toValue(t), b = Math.floor(t);
  const alt = isTemp ? `${((v - 32) * 5 / 9).toFixed(1)} °C` : VAR.alt ? `${(v * VAR.alt.factor).toFixed(1)} ${VAR.alt.units}` : `${(v * 25.4).toFixed(1)} mm`;
  val.innerHTML = `${fmtV(v, TH ? 0 : 1)}<small>${UNIT}</small>`;
  sub.innerHTML = `${alt} · band ${bandText(b)}<br>${Math.abs(lngLat.lat).toFixed(2)}°${lngLat.lat >= 0 ? "N" : "S"} ${Math.abs(lngLat.lng).toFixed(2)}°${lngLat.lng >= 0 ? "E" : "W"}`;
  cur.style.display = "block"; cur.style.left = pos(t);
}
map.on("mousemove", (e) => { if (pendingRO) return; pendingRO = requestAnimationFrame(() => { pendingRO = null; readout(e.point, e.lngLat); }); });
map.on("click", (e) => readout(e.point, e.lngLat));
document.getElementById("credit-model").textContent = meta.model + (VAR.id === "snow" ? " (10:1 snowfall from precipitation × categorical snow)" : "");
if (meta.model === "GFS") document.getElementById("credit-link").href = "https://registry.opendata.aws/noaa-gfs-bdp-pds/";
const zl = document.getElementById("zl");
zl.textContent = `z ${map.getZoom().toFixed(1)}`;
map.on("zoom", () => { zl.textContent = `z ${map.getZoom().toFixed(1)}`; });
document.getElementById("zin").onclick = () => map.zoomIn();
document.getElementById("zout").onclick = () => map.zoomOut();
const toggles = { "t-labels": ["lab10", "lab5"], "t-borders": ["coast", "state"] };
for (const [id, layers] of Object.entries(toggles)) {
  const b = document.getElementById(id);
  b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on);
    layers.forEach((l) => map.setLayoutProperty(l, "visibility", on ? "visible" : "none")); };
}
field(hour, levelFor(map.getZoom(), 2, true)); // warm the level the first view needs
</script>
</body>
